apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: frontend-deploy
  name: frontend-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-deploy
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: frontend-deploy
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        env:
          - name: EnvironmentFile
            valueFrom:
              configMapKeyRef:
                key: env.sh
                name: envfile

status: {}
