apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    app: backend-app
  name: backend-app
  namespace: frontend-ns
spec:
  containers:
  - image: php:latest
    name: backend-app
    args: ["sleep","3600"]
    ports:
    - containerPort: 80
    resources: 
      requests: 
         memory: 300Mi
         cpu: 100m
      limits:
         memory: 500Mi
         cpu: 500m
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
