apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: pod3
  name: pod3
spec:
  volumes:
       - name: pod-volume
         persistentVolumeClaim:
           claimName: pv-vol-claim
  containers:
  - image: nginx
    name: pod3
    command: ["sleep", "3600"]
    args: []
    volumeMounts:
    - name: pod-volume
      mountPath: /usr/share/nginx/html
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
