apiVersion: v1
kind: LimitRange
metadata:
  name: max-limit-request-quota
  namespace: frontend-ns
spec:
  limits:
    - default:
         cpu: 200m
         memory: 500Mi
      defaultRequest:
          cpu: 100m
          memory: 250Mi
      min:
          cpu: 80m
          memory: 100Mi
      max: 
          cpu: 600m
          memory: 600Mi
      type: Container